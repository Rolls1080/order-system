<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Заказ</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 60px auto; }
    input, button { width: 100%; padding: 8px; margin: 6px 0; box-sizing: border-box; }
    #result { margin-top: 12px; }
  </style>
</head>
<body>
  <h2>Оформление заказа</h2>
  <form id="orderForm">
    <input name="buyer"  placeholder="Покупатель" required>
    <input name="item"   placeholder="Товар" required>
    <input name="amount" type="number" step="0.01" min="0" placeholder="Сумма" required>
    <button type="submit">Отправить</button>
  </form>
  <p id="result"></p>
  <script>
    document.getElementById('orderForm').onsubmit = async (e) => {
      e.preventDefault();
      const body = Object.fromEntries(new FormData(e.target));
      const res  = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      const data = await res.json();
      document.getElementById('result').textContent = 'Создан заказ №' + data.order_id;
      e.target.reset();
    };
  </script>
</body>
</html>
